name: Guix Build

on:
  push:
    branches:
      - claude/gstreamer-implementation-011CUrgj9DxaFqUMTWowxyBi
      - claude/integration-scenarios-ffi-gstreamer
      - main
    paths:
      - 'tools/ffi/**'
      - 'tools/gstreamer/**'
      - 'guix.scm'
      - '.github/workflows/guix-build.yml'
  pull_request:
    paths:
      - 'tools/ffi/**'
      - 'tools/gstreamer/**'
      - 'guix.scm'
      - '.github/workflows/guix-build.yml'
  workflow_dispatch:

env:
  GUIX_VERSION: '1.4.0'

jobs:
  build-base:
    name: Build llama-cpp-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          channels: |
            (list (channel
                    (name 'guix)
                    (url "https://git.savannah.gnu.org/git/guix.git")
                    (branch "master")))

      - name: Cache Guix store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-store-${{ runner.os }}-${{ hashFiles('guix.scm') }}
          restore-keys: |
            guix-store-${{ runner.os }}-

      - name: Build llama-cpp-base
        run: |
          guix build -f guix.scm llama-cpp-base \
            --verbosity=2 \
            --keep-failed

      - name: Save build log
        if: always()
        run: |
          mkdir -p build-logs
          guix build -f guix.scm llama-cpp-base --log-file > build-logs/base.log || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs-base
          path: build-logs/

  build-simple:
    name: Build llama-simple (C API)
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Cache Guix store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-store-${{ runner.os }}-${{ hashFiles('guix.scm') }}
          restore-keys: |
            guix-store-${{ runner.os }}-

      - name: Build llama-simple
        run: |
          guix build -f guix.scm llama-simple \
            --verbosity=2 \
            --keep-failed

      - name: Run tests
        run: |
          # Enter build environment and run tests
          guix shell -D -f guix.scm -- bash -c "
            cd tools/ffi
            mkdir -p build
            cd build
            cmake .. -DLLAMA_SIMPLE_BUILD_TESTS=ON
            make -j\$(nproc)
            ctest --output-on-failure
          "

      - name: Save build artifacts
        run: |
          mkdir -p artifacts
          cp -v /gnu/store/$(guix build -f guix.scm llama-simple | tail -1)/lib/libllama_simple.so* artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: llama-simple-lib
          path: artifacts/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs-simple
          path: build-logs/

  build-gstreamer:
    name: Build gst-llama plugin
    runs-on: ubuntu-latest
    needs: build-simple
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Cache Guix store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-store-${{ runner.os }}-${{ hashFiles('guix.scm') }}
          restore-keys: |
            guix-store-${{ runner.os }}-

      - name: Build gst-llama
        run: |
          guix build -f guix.scm gst-llama \
            --verbosity=2 \
            --keep-failed

      - name: Run plugin tests
        run: |
          guix shell -D -f guix.scm -- bash -c "
            cd tools/gstreamer
            meson setup build
            meson compile -C build
            meson test -C build --verbose
          "

      - name: Test plugin registration
        run: |
          guix shell -D -f guix.scm -- bash -c "
            export GST_PLUGIN_PATH=/gnu/store/\$(guix build -f guix.scm gst-llama | tail -1)/lib/gstreamer-1.0
            gst-inspect-1.0 llama
          "

      - name: Save build artifacts
        run: |
          mkdir -p artifacts
          PLUGIN_PATH=/gnu/store/$(guix build -f guix.scm gst-llama | tail -1)/lib/gstreamer-1.0
          cp -rv $PLUGIN_PATH artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: gst-llama-plugin
          path: artifacts/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs-gstreamer
          path: build-logs/

  build-all:
    name: Build complete suite
    runs-on: ubuntu-latest
    needs: [build-simple, build-gstreamer]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Cache Guix store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-store-${{ runner.os }}-${{ hashFiles('guix.scm') }}
          restore-keys: |
            guix-store-${{ runner.os }}-

      - name: Build all packages
        run: |
          guix build -f guix.scm \
            --verbosity=2 \
            --keep-failed

      - name: Generate build report
        if: always()
        run: |
          mkdir -p reports
          cat > reports/build-summary.txt <<EOF
          Guix Build Summary
          ==================
          Date: $(date)
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Packages Built:
          ---------------
          $(guix build -f guix.scm --dry-run 2>&1 | grep "would be built" || echo "All cached")

          Store Paths:
          ------------
          $(guix build -f guix.scm 2>&1 || echo "Build failed")
          EOF

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-report
          path: reports/

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Cache Guix store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-store-${{ runner.os }}-${{ hashFiles('guix.scm') }}
          restore-keys: |
            guix-store-${{ runner.os }}-

      - name: Run integration tests
        run: |
          guix shell -D -f guix.scm -- bash -c "
            # Test 1: C API basic usage
            cd tools/ffi/tests
            ./run_integration_tests.sh

            # Test 2: GStreamer pipeline
            export GST_PLUGIN_PATH=/gnu/store/\$(guix build -f guix.scm gst-llama | tail -1)/lib/gstreamer-1.0
            cd ../../gstreamer/tests
            ./run_pipeline_tests.sh
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            tools/ffi/tests/results/
            tools/gstreamer/tests/results/
